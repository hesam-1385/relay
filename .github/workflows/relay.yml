name: relay

# پروکسی تلگرام همیشه-روشن: هر ران ۵ ساعت و ۴۸ دقیقه کار می‌کند،
# ۶ دقیقه قبل از پایانش ران بعدی را خودش استارت می‌زند تا وقفه نیفتد.
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */3 * * *'   # فقط پشتیبان؛ اگر زنجیره پاره شد حداکثر ۳ ساعت بعد وصل می‌شود

permissions:
  actions: write
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 359
    env:
      MTP_SECRET: ${{ secrets.MTP_SECRET }}
      PORT: '38841'
    steps:
      - name: setup
        run: |
          set -e
          curl -fsSL -o /tmp/mtp.py https://raw.githubusercontent.com/alexbers/mtprotoproxy/master/mtprotoproxy.py
          mkdir -p /tmp/bx
          curl -fsSL -o /tmp/bore.tgz https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/bore.tgz -C /tmp/bx
          sudo install -m755 "$(find /tmp/bx -type f -name 'bore*' | head -1)" /usr/local/bin/bore
          bore --version

      - name: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          SECRET="${MTP_SECRET:-e5c1a7b93d24f60e8a71cb3f9d024e68}"

          printf 'PORT = 3129\nUSERS = {"hesam": "%s"}\nMODES = {"classic": True, "secure": True, "tls": True}\nTLS_DOMAIN = "cloudflare.com"\n' "$SECRET" > /tmp/cfg.py

          start_mtp() {
            pkill -f '/tmp/mtp.py' 2>/dev/null || true
            sleep 1
            nohup python3 /tmp/mtp.py /tmp/cfg.py > /tmp/mtp.log 2>&1 &
          }

          # تا ۱۰ دقیقه تلاش می‌کند پورت ثابت را بگیرد (اگر ران قبلی هنوز پورت را دارد صبر می‌کند)
          start_bore() {
            for try in $(seq 1 40); do
              pkill -f 'bore local' 2>/dev/null || true
              sleep 1
              : > /tmp/bore.log
              nohup bore local 3129 --to bore.pub --port "$PORT" > /tmp/bore.log 2>&1 &
              for i in $(seq 1 15); do
                grep -q "listening at bore.pub:$PORT" /tmp/bore.log && { echo "bore روی پورت $PORT بالا آمد"; return 0; }
                pgrep -f 'bore local' >/dev/null || break
                sleep 1
              done
              echo "تلاش $try ناموفق، ۱۵ ثانیه صبر"
              sleep 15
            done
            return 1
          }

          start_mtp; sleep 5
          start_bore || echo "bore بعد از ۱۰ دقیقه هم پورت را نگرفت"

          START=$(date +%s)
          CHAIN=$((345*60))   # دقیقه ۳۴۵: ران بعدی را استارت بزن
          END=$((352*60))     # دقیقه ۳۵۲: پورت را آزاد کن (ران بعدی جایش را می‌گیرد)
          while :; do
            NOW=$(( $(date +%s) - START ))
            [ "$NOW" -ge "$END" ] && break
            if [ "$NOW" -ge "$CHAIN" ] && [ -z "${CHAINED:-}" ]; then
              CHAINED=1
              echo "زنجیره: استارت ران بعدی"
              curl -s -o /dev/null -w 'dispatch %{http_code}\n' -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/relay.yml/dispatches" \
                -d '{"ref":"main"}' || true
            fi
            if ! pgrep -f '/tmp/mtp.py' >/dev/null; then echo "$(date -u +%T) mtproto مرد، ری‌استارت"; start_mtp; sleep 3; fi
            if ! grep -q "listening at bore.pub:$PORT" /tmp/bore.log 2>/dev/null || ! pgrep -f 'bore local' >/dev/null; then
              echo "$(date -u +%T) bore مرد، ری‌استارت"
              start_bore || true
            fi
            sleep 60
          done
          echo "پایان ران؛ آزادکردن پورت برای ران بعدی"
          pkill -f 'bore local' 2>/dev/null || true
          sleep 3
