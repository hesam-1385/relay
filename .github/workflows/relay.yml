name: relay

# پروکسی MTProto همیشه-روشن روی گیت‌هاب اکشنز:
# هر ران ~۵ ساعت و ۴۵ دقیقه کار می‌کند، ۵ دقیقه قبل از پایانش ران بعدی را خودش استارت می‌زند
# و ۲ دقیقه آخر پورت را آزاد می‌کند تا ران بعدی همان پورت ثابت را بگیرد.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # پشتیبان: اگر زنجیره پاره شد حداکثر ۱ ساعت بعد خودش وصل می‌شود

permissions:
  actions: write
  contents: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 359
    env:
      MTP_SECRET: ${{ secrets.MTP_SECRET }}
      PORT: '38841'
    steps:
      - name: setup
        run: |
          set -e
          curl -fsSL -o /tmp/mtp.py https://raw.githubusercontent.com/alexbers/mtprotoproxy/master/mtprotoproxy.py
          mkdir -p /tmp/bx
          curl -fsSL -o /tmp/bore.tgz https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/bore.tgz -C /tmp/bx
          sudo install -m755 "$(find /tmp/bx -type f -name 'bore*' | head -1)" /usr/local/bin/bore
          bore --version
          python3 -c "import sys;print(sys.version)"

      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          SECRET="${MTP_SECRET:-e5c1a7b93d24f60e8a71cb3f9d024e68}"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          printf 'PORT = 3129\nUSERS = {"hesam": "%s"}\nMODES = {"classic": True, "secure": True, "tls": True}\nTLS_DOMAIN = "cloudflare.com"\n' "$SECRET" > /tmp/cfg.py

          publish() {  # $1 = extra note
            BODY="$(printf 'when: %s\nrun: %s\npublic-port: %s\nfixed-port-target: %s\nextra-port: %s\nnote: %s\n--- mtp ---\n%s\n--- bore ---\n%s\n' \
              "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" "${PUBPORT:-none}" "$PORT" "${EXTRA:-none}" "$1" \
              "$(tail -c 600 /tmp/mtp.log 2>/dev/null)" "$(tail -c 900 /tmp/bore.log 2>/dev/null)")"
            printf '%s' "$BODY" > /tmp/st.txt
            SHA="$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/contents/status.txt" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("sha",""))' 2>/dev/null || true)"
            if [ -n "$SHA" ]; then
              J="$(python3 -c 'import sys,json,base64;body=open("/tmp/st.txt").read();print(json.dumps({"message":"status","content":base64.b64encode(body.encode()).decode(),"sha":sys.argv[1]}))' "$SHA")"
            else
              J="$(python3 -c 'import json,base64;body=open("/tmp/st.txt").read();print(json.dumps({"message":"status","content":base64.b64encode(body.encode()).decode()}))')"
            fi
            curl -s -o /dev/null -X PUT -H "Authorization: Bearer $GH_TOKEN" "$API/contents/status.txt" -d "$J" || true
          }

          start_mtp() {
            pkill -f '/tmp/mtp.py' 2>/dev/null || true
            sleep 1
            nohup python3 /tmp/mtp.py /tmp/cfg.py > /tmp/mtp.log 2>&1 &
          }
          try_bore() {
            : > /tmp/bore.log
            nohup bore local 3129 --to bore.pub --port "$1" > /tmp/bore.log 2>&1 &
            for i in $(seq 1 20); do
              grep -q "listening at bore.pub:$1" /tmp/bore.log && { PUBPORT="$1"; return 0; }
              pgrep -f 'bore local' >/dev/null || return 1
              sleep 1
            done
            return 1
          }

          start_mtp; sleep 5
          PUBPORT=""
          OK=0
          # تا ۳۰ دقیقه صبر می‌کنیم ران قبلی پورت ثابت را آزاد کند؛ این‌طوری
          # بین دو ران هیچ فاصله‌ای نمی‌افتد و پورت هرگز عوض نمی‌شود.
          for try in $(seq 1 120); do
            pkill -f 'bore local' 2>/dev/null || true
            sleep 1
            if try_bore "$PORT"; then OK=1; echo "پورت ثابت $PORT گرفته شد (تلاش $try)"; break; fi
            [ "$try" = "1" ] && publish "waiting for fixed port"
            sleep 14
          done
          if [ "$OK" != "1" ]; then
            echo "پورت ثابت نشد؛ پورت تصادفی"
            pkill -f 'bore local' 2>/dev/null || true; sleep 2
            : > /tmp/bore.log
            nohup bore local 3129 --to bore.pub > /tmp/bore.log 2>&1 &
            for i in $(seq 1 25); do
              P="$(grep -o 'bore.pub:[0-9]*' /tmp/bore.log | head -1 | cut -d: -f2 || true)"
              [ -n "$P" ] && { PUBPORT="$P"; break; }
              sleep 2
            done
          fi
          # مسیر دوم روی پورت تصادفی bore؛ برای مقایسه و جایگزین اگر پورت ثابت شلوغ بود
          pkill -f 'bore local 3129 --to bore.pub$' 2>/dev/null || true
          nohup bore local 3129 --to bore.pub > /tmp/bore2.log 2>&1 &
          EXTRA=""
          for i in $(seq 1 20); do
            EXTRA="$(grep -o 'bore.pub:[0-9]*' /tmp/bore2.log | head -1 | cut -d: -f2 || true)"
            [ -n "$EXTRA" ] && break; sleep 2
          done
          echo "extra-port=$EXTRA"
          publish "started"
          echo "public-port=$PUBPORT"

          START=$(date +%s)
          CHAIN=$((300*60))
          END=$((344*60))
          LAST_PUB=0
          while :; do
            NOW=$(( $(date +%s) - START ))
            [ "$NOW" -ge "$END" ] && break
            if [ "$NOW" -ge "$CHAIN" ] && [ -z "${CHAINED:-}" ]; then
              CHAINED=1; echo "زنجیره: استارت ران بعدی"
              curl -s -o /dev/null -w 'dispatch %{http_code}\n' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$API/actions/workflows/relay.yml/dispatches" -d '{"ref":"main"}' || true
            fi
            if ! pgrep -f '/tmp/mtp.py' >/dev/null; then echo "$(date -u +%T) mtproto مرد"; start_mtp; sleep 3; fi
            if ! pgrep -f 'bore local' >/dev/null; then
              echo "$(date -u +%T) bore مرد، ری‌استارت"
              if [ "$PUBPORT" = "$PORT" ]; then try_bore "$PORT" || { n=1; until try_bore "$PORT" || [ $n -ge 20 ]; do n=$((n+1)); sleep 15; done; }; fi
              publish "bore restarted"
            fi
            if [ $(( NOW - LAST_PUB )) -ge 600 ]; then LAST_PUB=$NOW; publish "heartbeat"; fi
            sleep 60
          done
          echo "پایان ران؛ آزادکردن پورت"
          pkill -f 'bore local' 2>/dev/null || true
          sleep 3
