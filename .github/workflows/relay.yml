name: relay

# پروکسی تلگرام همیشه-روشن: هر ران ۵ ساعت و ۴۸ دقیقه کار می‌کند،
# ۸ دقیقه قبل از پایان، ران بعدی را خودش استارت می‌زند (زنجیره‌ای) تا وقفه نیفتد.
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */3 * * *'   # فقط پشتیبان؛ اگر زنجیره پاره شد حداکثر ۳ ساعت بعد وصل می‌شود

permissions:
  actions: write
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 359
    env:
      MTP_SECRET: ${{ secrets.MTP_SECRET }}
      PORT: '38841'
    steps:
      - name: setup
        run: |
          set -e
          curl -fsSL -o /tmp/mtp.py https://raw.githubusercontent.com/alexbers/mtprotoproxy/master/mtprotoproxy.py
          mkdir -p /tmp/bx
          curl -fsSL -o /tmp/bore.tgz https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/bore.tgz -C /tmp/bx
          sudo install -m755 "$(find /tmp/bx -type f -name 'bore*' | head -1)" /usr/local/bin/bore
          bore --version

      - name: run
        run: |
          set -u
          SECRET="${MTP_SECRET:-e5c1a7b93d24f60e8a71cb3f9d024e68}"
          # اگر ران دیگری همین حالا پورت را گرفته، کاری نکن
          if python3 - "$PORT" <<'PY'
          import socket,sys
          try:
              s=socket.create_connection(("bore.pub",int(sys.argv[1])),8); s.close(); sys.exit(0)
          except Exception: sys.exit(1)
          PY
          then
            echo "پورت از قبل باز است؛ ران دیگری فعال است. خارج می‌شوم."
            exit 0
          fi

          printf 'PORT = 3129\nUSERS = {"hesam": "%s"}\nMODES = {"classic": True, "secure": True, "tls": True}\nTLS_DOMAIN = "cloudflare.com"\n' "$SECRET" > /tmp/cfg.py
          start_mtp() {
            pkill -f mtprotoproxy.py 2>/dev/null || true
            pkill -f 'mtp.py' 2>/dev/null || true
            sleep 1
            nohup python3 /tmp/mtp.py /tmp/cfg.py > /tmp/mtp.log 2>&1 &
          }
          start_bore() {
            pkill -f 'bore local' 2>/dev/null || true
            sleep 2
            nohup bore local 3129 --to bore.pub --port "$PORT" > /tmp/bore.log 2>&1 &
            for i in $(seq 1 30); do
              grep -q "listening at bore.pub:$PORT" /tmp/bore.log && return 0
              sleep 2
            done
            return 1
          }
          start_mtp; sleep 4
          if ! start_bore; then echo "bore نتوانست پورت ثابت را بگیرد، تلاش دوباره"; sleep 20; start_bore || true; fi
          echo "--- ALL SET ---"
          tail -3 /tmp/bore.log; tail -2 /tmp/mtp.log

          START=$(date +%s)
          CHAIN=$((348*60-360))   # دقیقه ۳۴۲: ران بعدی را استارت بزن
          END=$((348*60))         # دقیقه ۳۴۸: پورت را آزاد کن
          while :; do
            NOW=$(( $(date +%s) - START ))
            [ "$NOW" -ge "$END" ] && break
            if [ "$NOW" -ge "$CHAIN" ] && [ -z "${CHAINED:-}" ]; then
              CHAINED=1
              echo "زنجیره: استارت ران بعدی"
              curl -s -o /dev/null -w 'dispatch %{http_code}\n' -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/relay.yml/dispatches" \
                -d '{"ref":"main"}' || true
            fi
            # نگهبان: اگر پروکسی یا تونل مرد، از نو بالا بیاور
            if ! pgrep -f 'mtp.py' >/dev/null; then echo "$(date -u +%T) mtproto مرد، ری‌استارت"; start_mtp; sleep 3; fi
            if ! pgrep -f 'bore local' >/dev/null; then echo "$(date -u +%T) bore مرد، ری‌استارت"; start_bore || true; fi
            sleep 60
          done
          echo "پایان ران؛ آزادکردن پورت"
          pkill -f 'bore local' 2>/dev/null || true
          sleep 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
